# gowui with password accounts and no SSO in front (SPEC §10.1).
#
#   docker compose -f deploy/compose.password.yaml up -d --build
#   docker compose -f deploy/compose.password.yaml exec gowui gowui user add alice
#
# The port is published on loopback only: the sign-in form sends the password as typed, so put a
# TLS proxy in front before exposing it. Prefer GOWUI_COOKIE_SECURE: "1" with no trusted proxy, or
# a proxy in its own container whose own address goes in GOWUI_TRUSTED_PROXIES. Listing a proxy
# that runs on the host means trusting the gateway address every process on the host shares, and
# with it any X-Forwarded-For they forge to pick their own bucket in the per-client login throttle
# (SPEC §7.1, §7.10). Replace the example engine with your own.
name: gowui

services:
  gowui:
    build: ..
    image: gowui:local
    restart: unless-stopped
    environment:
      GOWUI_AUTH: "local"
      GOWUI_ENGINES: >-
        [{"id": "katago", "label": "KataGo", "protocol": "analysis",
          "host": "katago.example.internal", "port": 6364}]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gowui-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  gowui-data:
