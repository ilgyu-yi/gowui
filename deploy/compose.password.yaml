# gowui with password accounts and no SSO in front (SPEC §10.1).
#
#   docker compose -f deploy/compose.password.yaml up -d --build
#   docker compose -f deploy/compose.password.yaml exec gowui gowui user add alice
#
# The port is published on loopback only: the sign-in form sends the password as typed, so put a
# TLS proxy in front before exposing it (list the proxy in GOWUI_TRUSTED_PROXIES, SPEC §7.10, or
# set GOWUI_COOKIE_SECURE: "1"). Replace the example engine with your own.
name: gowui

services:
  gowui:
    build: ..
    image: gowui:local
    restart: unless-stopped
    environment:
      GOWUI_AUTH: "local"
      GOWUI_ENGINES: >-
        [{"id": "katago", "label": "KataGo", "protocol": "analysis",
          "host": "katago.example.internal", "port": 6364}]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gowui-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  gowui-data:
