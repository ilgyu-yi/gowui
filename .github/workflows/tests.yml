name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The frontend checks (node --check, the tuple-validator agreement) need node; with CI set
      # they fail instead of skipping when it is missing (README "Frontend checks").
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: pytest

  # The page in Chromium through Playwright (SPEC §3.8, §7.5): `pytest -m browser`.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      GOWUI_BROWSER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,browser]"
      - id: playwright
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # --with-deps installs the system libraries Chromium needs; the download itself is skipped
      # when the cache already holds this version's browser.
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m browser
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-artifacts
          path: test-artifacts/
          retention-days: 7

  # The server-mode image (SPEC §10.1): build it, validate the deploy/ examples, run the image.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t gowui:ci .
      - run: docker compose -f deploy/compose.password.yaml config -q
      - run: docker compose -f deploy/compose.sso.yaml config -q
      - run: bash tools/container_smoke.sh gowui:ci
      - run: docker image ls gowui:ci
