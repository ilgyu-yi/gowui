[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gowui"
version = "0.1.0"
description = "Browser Go GUI for KataGo and handol-mux, run locally or as a multi-user server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
gowui = "gowui.cli:main"

[tool.setuptools.packages.find]
include = ["gowui*"]

[tool.setuptools.package-data]
gowui = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tools"]
